    <style>

        :root {
            --bg-color: #06080c;
            --card-bg: rgba(16, 20, 29, 0.90);
            --card-bg-strong: rgba(12, 16, 23, 0.96);

            --text-main: #c5c6c7;
            --text-heading: #ffffff;
            --text-muted: #94a3b8;

            --accent-bordeaux: #800020;
            --accent-red-bright: #a81c37;

            --border-color: #1f2833;
            --border-soft: rgba(255, 255, 255, 0.06);

            --header-height: 145px;
            --max-width: 1050px;

            --shadow-heavy: 0 20px 40px rgba(0, 0, 0, 0.80);
            --shadow-cover: 0 18px 38px rgba(0, 0, 0, 0.90);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--header-height) + 20px);
        }


        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-main);

            line-height: 1.8;
            min-height: 100vh;

            overflow-x: hidden;
        }


        body.menu-open {
            overflow: hidden;
        }


        img {
            display: block;
            max-width: 100%;
        }


        a,
        button {
            -webkit-tap-highlight-color: transparent;
        }


        ::selection {
            background: rgba(128, 0, 32, 0.50);
            color: #ffffff;
        }


        .author-logo,
        .cinematic-title,
        h1.book-title,
        .section-title,
        .work-card h3,
        .about-card h3,
        .contact-box h3,
        .legal-card h3,
        .archive-title {
            font-family:
                "Trajan Pro",
                Georgia,
                serif;
        }


        .page-background {
            position: fixed;
            inset: 0;

            z-index: -5;

            background:
                linear-gradient(
                    rgba(6, 8, 12, 0.84),
                    rgba(6, 8, 12, 0.95)
                ),
                url("assets/skeldvik-background.png");

            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;

            transform: scale(1.02);
        }


        .page-background::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(180, 190, 200, 0.08),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 80% 65%,
                    rgba(128, 0, 32, 0.035),
                    transparent 28%
                );

            pointer-events: none;
        }


        .fog {
            position: fixed;

            width: 160%;
            height: 100vh;

            top: 0;
            left: -30%;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(220, 225, 230, 0.075),
                    transparent 62%
                );

            filter: blur(58px);

            opacity: 0.26;

            animation:
                fogMove
                24s
                ease-in-out
                infinite
                alternate;
        }


        .fog.fog-two {
            top: 25%;

            opacity: 0.12;

            animation-duration: 36s;
            animation-direction: alternate-reverse;
        }


        @keyframes fogMove {

            from {
                transform: translate3d(-5%, 0, 0);
            }

            to {
                transform: translate3d(8%, 0, 0);
            }

        }


        .screen-grain {
            position: fixed;
            inset: 0;

            z-index: 3500;

            pointer-events: none;

            opacity: 0.10;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.012) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.008) 1px,
                    transparent 1px
                );

            background-size: 3px 3px;
        }


        .scroll-progress {
            position: fixed;

            top: 0;
            left: 0;

            width: 0;
            height: 2px;

            z-index: 6000;

            background:
                linear-gradient(
                    90deg,
                    var(--accent-bordeaux),
                    var(--accent-red-bright)
                );

            box-shadow:
                0 0 14px
                rgba(168, 28, 55, 0.35);
        }

            top: -100px;
            left: 18px;

            z-index: 7000;
